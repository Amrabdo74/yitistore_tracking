services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yitistore_tracking
      POSTGRES_USER: yitistore
      POSTGRES_PASSWORD: yitistore
    ports:
      - "5432:5432"
    volumes:
      - yitistore_pg:/var/lib/postgresql/data

volumes:
  yitistore_pg:
